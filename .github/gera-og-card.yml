name: Gera card Open Graph

on:
  push:
    paths:
      - 'scripts/gera-og-card.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fontes (Open Sans com fallback DejaVu)
        run: |
          mkdir -p fonts/
          for peso in Bold Regular; do
            curl -sfL "https://raw.githubusercontent.com/googlefonts/opensans/main/fonts/ttf/OpenSans-$peso.ttf" -o "fonts/OpenSans-$peso.ttf" || echo "fallback DejaVu"
          done
      - run: pip install pillow
      - name: Gera o card
        run: python scripts/gera-og-card.py
      - name: Commit do card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/og-card.png
          git diff --cached --quiet || git commit -m "Gera card OG (automatico)"
          git push
